---
- name: Basic z/OS Gather STCs
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
    - name: Return all available z/OS STC facts
      ibm.ibm_zos_core.zos_job_query:
      register: zos_stcs

    - name: Print return info from previous task
      ansible.builtin.debug:
        var: zos_stcs

